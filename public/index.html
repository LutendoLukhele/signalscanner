<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3a;
      --accent:   #6366f1;
      --high:     #ef4444;
      --med:      #f59e0b;
      --low:      #22c55e;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --radius:   8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span { color: var(--accent); }

    .scan-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.5rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .scan-btn:hover   { opacity: .85; }
    .scan-btn:disabled { opacity: .5; cursor: not-allowed; }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    /* ── Stats sidebar ─────────────────────────────────────────────────── */
    .sidebar { display: flex; flex-direction: column; gap: 1rem; }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .stat-card .label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .value { font-size: 1.75rem; font-weight: 700; margin-top: .25rem; }
    .stat-card .value.high  { color: var(--high); }
    .stat-card .value.green { color: var(--low); }

    .mini-bar { margin-top: .75rem; }
    .mini-bar .bar-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .3rem; font-size: .75rem; }
    .mini-bar .bar-row .key { flex: 0 0 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .mini-bar .track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; }
    .mini-bar .fill  { height: 100%; background: var(--accent); border-radius: 3px; }
    .mini-bar .count { flex: 0 0 28px; text-align: right; }

    /* ── Main content ──────────────────────────────────────────────────── */
    .main { display: flex; flex-direction: column; gap: 1rem; }

    .filters {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
    }

    .filters select, .filters input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: .4rem .75rem;
      font-size: .875rem;
    }

    .filters label { display: flex; align-items: center; gap: .4rem; font-size: .875rem; color: var(--muted); }
    .filters label input[type=checkbox] { accent-color: var(--accent); }

    /* ── Lead cards ────────────────────────────────────────────────────── */
    .lead-list { display: flex; flex-direction: column; gap: .75rem; }

    .lead-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      cursor: pointer;
      transition: border-color .15s;
    }
    .lead-card:hover { border-color: var(--accent); }

    .lead-card .top {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .5rem;
    }

    .badge {
      font-size: .7rem;
      font-weight: 700;
      padding: .15rem .5rem;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge.HIGH    { background: #ef444420; color: var(--high); }
    .badge.MEDIUM  { background: #f59e0b20; color: var(--med);  }
    .badge.LOW     { background: #22c55e20; color: var(--low);  }
    .badge.source  { background: #6366f120; color: var(--accent); }

    .score-pill {
      font-size: .75rem;
      font-weight: 700;
      min-width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-left: auto;
    }
    .score-high   { background: var(--high);    color: #fff; }
    .score-medium { background: var(--med);     color: #000; }
    .score-low    { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

    .lead-title { font-size: .9rem; font-weight: 600; margin-bottom: .3rem; }
    .lead-text  { font-size: .82rem; color: var(--muted); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

    .lead-meta { display: flex; gap: 1rem; font-size: .75rem; color: var(--muted); margin-top: .6rem; }

    /* ── Modal ──────────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
    .modal .full-text { font-size: .875rem; color: var(--muted); line-height: 1.6; margin-bottom: 1rem; }
    .modal .link { font-size: .75rem; color: var(--accent); word-break: break-all; }

    .reply-area {
      width: 100%;
      min-height: 100px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: .75rem;
      font-size: .875rem;
      resize: vertical;
      margin-top: 1rem;
    }

    .modal-actions { display: flex; gap: .75rem; margin-top: .75rem; justify-content: flex-end; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: .4rem 1rem;
      font-size: .875rem;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      padding: .4rem 1rem;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Pagination ──────────────────────────────────────────────────────── */
    .pagination { display: flex; align-items: center; gap: .75rem; font-size: .875rem; justify-content: center; }
    .pagination button { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: .3rem .9rem; cursor: pointer; }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }

    .empty { text-align: center; color: var(--muted); padding: 3rem 0; }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Signal <span>Scanner</span></h1>
    <button class="scan-btn" id="scanBtn">Run Scan</button>
  </header>

  <div class="layout">
    <!-- Sidebar: stats -->
    <aside class="sidebar" id="sidebar">
      <div class="stat-card">
        <div class="label">Total Leads</div>
        <div class="value green" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="label">High Urgency</div>
        <div class="value high" id="statHigh">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Avg Score</div>
        <div class="value" id="statAvg">—</div>
      </div>
      <div class="stat-card">
        <div class="label">By Source</div>
        <div class="mini-bar" id="barSource"></div>
      </div>
      <div class="stat-card">
        <div class="label">Pain Type</div>
        <div class="mini-bar" id="barPain"></div>
      </div>
    </aside>

    <!-- Main: filters + lead list -->
    <div class="main">
      <div class="filters">
        <select id="filterSource">
          <option value="">All sources</option>
          <option value="reddit">Reddit</option>
          <option value="twitter">Twitter</option>
          <option value="g2">G2</option>
          <option value="capterra">Capterra</option>
          <option value="linkedin">LinkedIn</option>
        </select>
        <select id="filterUrgency">
          <option value="">All urgency</option>
          <option value="HIGH">High</option>
          <option value="MEDIUM">Medium</option>
          <option value="LOW">Low</option>
        </select>
        <select id="filterMinScore">
          <option value="">Min score</option>
          <option value="3">3+</option>
          <option value="5">5+</option>
          <option value="7">7+</option>
          <option value="9">9+</option>
        </select>
        <label>
          <input type="checkbox" id="filterUnreplied" />
          Unreplied only
        </label>
      </div>

      <div class="lead-list" id="leadList">
        <div class="empty">No leads yet — run a scan to get started.</div>
      </div>

      <div class="pagination" id="pagination" style="display:none">
        <button id="prevPage">← Prev</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextPage">Next →</button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="top" id="modalBadges"></div>
      <h2 id="modalTitle"></h2>
      <div class="full-text" id="modalText"></div>
      <a class="link" id="modalLink" target="_blank" rel="noopener"></a>
      <textarea class="reply-area" id="modalReply" placeholder="Draft your reply…"></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="modalClose">Close</button>
        <button class="btn-primary"   id="modalSave">Save Reply</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
